# GitHub Pages: 예전 공개 주소(https://makerskim.github.io/aidam/)에는 '준비 중' 화면만 둔다.
# 실제 사이트는 Cloudflare(cloudflare.yml)에서 로그인·잠금과 함께 나간다.
# 저장소를 비공개로 바꾸면 이 작업은 건너뛴다.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 준비 중 화면만 올린다
        run: |
          mkdir -p out
          cp tools/closed.html out/index.html
          cp tools/closed.html out/404.html
          printf "self.addEventListener('install',()=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(k=>Promise.all(k.map(c=>caches.delete(c)))).then(()=>self.registration.unregister())));\n" > out/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
