# Netlify 배포 설정 — 이 파일 덕분에 Netlify 화면에서 아무것도 바꾸지 않고 "Deploy"만 누르면 된다.
[build]
  command = "pnpm test && pnpm build && pnpm budget"
  publish = "apps/web/dist"
  # 무료 요금제는 배포 1번에 15크레딧(월 300)을 쓴다.
  # 사이트에 영향이 없는 변경(문서·테스트·CI 설정만 바뀜)은 빌드를 건너뛴다.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- apps/web packages/engine/src packages/engine/package.json package.json pnpm-lock.yaml pnpm-workspace.yaml netlify.toml"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
