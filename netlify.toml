# Netlify 배포 설정 — 이 파일 덕분에 Netlify 화면에서 아무것도 바꾸지 않고 "Deploy"만 누르면 된다.
[build]
  command = "pnpm test && pnpm build && pnpm budget"
  publish = "apps/web/dist"
  # 무료 요금제는 배포 1번에 15크레딧(월 300)을 쓴다. 한도를 넘으면 요금이 나가지 않고 사이트가 다음 달까지 멈춘다.
  # 그래서 GitHub에 올릴 때마다 자동으로 배포하지 않는다. 커밋 메시지에 [deploy]가 있을 때만 배포한다.
  # (ignore 명령이 0으로 끝나면 빌드를 건너뛰고, 1로 끝나면 빌드한다)
  ignore = "git log -1 --format=%B $COMMIT_REF | grep -q '\\[deploy\\]' && exit 1 || exit 0"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
