# 아이담 서버 + 사이트(Cloudflare Workers + D1, 무료 요금제로 충분).
# 배포는 GitHub Actions(.github/workflows/cloudflare.yml)가 한다.
name = "aidam"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# 사이트 파일(먼저 pnpm build로 만든다). 모든 요청이 서버 코드를 먼저 거친다(출시 전 잠금·보안 머리말).
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# 계정·분석 열쇠·주문·저장한 이름. id는 배포 워크플로가 자동으로 만들어 채운다.
[[d1_databases]]
binding = "DB"
database_name = "aidam"
database_id = "D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
# closed: 출시 전(관리자만 들어온다) / open: 모두에게 열림. GitHub 변수 SITE_MODE로 바꾼다.
SITE_MODE = "closed"
# 1회 = 분석 1건. 계정마다 첫 1건은 무료, 그 뒤는 이 가격(원)
PRICE_KRW = "990"
ORDER_NAME = "아이담 이름 분석 1회"
# 관리자 번호를 한 번 넣으면 결제 없이 쓸 수 있는 시간
ADMIN_PASS_HOURS = "12"

# 비밀값(코드·저장소에 넣지 않는다). GitHub 저장소 Settings → Secrets에 넣으면 배포 때 자동으로 올라간다.
#   ADMIN_EMAILS                            관리자 Google 계정 이메일
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET  Google 로그인
#   KAKAO_REST_KEY (KAKAO_CLIENT_SECRET)    카카오 로그인
#   NTFY_TOPIC                              관리자 번호를 휴대폰 알림으로 받을 주제 이름
#   TOSS_SECRET_KEY                         토스페이먼츠 시크릿 키(없으면 결제 준비 중)
#   SOLAPI_API_KEY, SOLAPI_API_SECRET, SMS_FROM, ADMIN_PHONE   관리자 번호를 문자로 받을 때(선택)
